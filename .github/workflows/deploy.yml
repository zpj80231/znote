#
# 构建 VuePress 站点并将其部署到 GitHub Pages 的工作流程
#
name: Deploy GitHub Pages

# 触发条件：在 push 到 master 分支后
# 如果你使用 `main` 分支作为默认分支，请将其更改为 `main`
on:
  push:
    branches:
      - master

  # 允许你从 Actions 选项卡手动运行此工作流程
  workflow_dispatch:

# 环境变量
env:
  TZ: Asia/Shanghai

# GitHub 官方 Pages 部署所需权限（使用内置的 GITHUB_TOKEN）
# - contents: read     拉取仓库代码
# - pages: write       写入 GitHub Pages 服务
# - id-token: write    用于 GitHub OIDC 鉴权（actions/deploy-pages 内部使用）
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许同时进行一次部署，跳过正在运行和最新队列之间的运行队列
# 但是，不要取消正在进行的运行，因为我们希望允许这些生产部署完成
concurrency:
  group: pages
  cancel-in-progress: false

# 任务
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 绑定到 github-pages 环境，部署成功后此处 URL 会显示在 Actions 运行详情中
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    strategy:
      matrix:
        node-version: [ 22 ]
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Build 🔧
        run: |
          # 清理之前的构建文件
          rm -rf docs/.vuepress/dist
          rm -rf node_modules/.cache
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Inject Cache Busting Info into HTML ♻️
        run: |
          BUILD_DATE=$(date "+%Y-%m-%d %H:%M:%S")
          echo "Injecting build date: $BUILD_DATE into html files"
          find docs/.vuepress/dist -name "*.html" -type f -print0 | xargs -0 -I {} bash -c "sed -i 's#</head>#<!-- Build Date: ${BUILD_DATE} -->\n</head>#' '{}'"

      # ---------- GitHub Pages 官方部署 3 步 ----------
      # 前置要求：仓库 Settings → Pages → Source 必须设置为 "GitHub Actions"
      # 站点访问地址：https://zpj80231.github.io/znote/ （默认）
      #            或在 Settings → Pages → Custom domain 配置自定义域名

      # 1) 初始化 Pages 运行环境，输出 base_path 等供后续步骤使用
      - name: Setup Pages 📄
        uses: actions/configure-pages@v5

      # 2) 把构建产物打包上传为 Pages artifact（默认名 github-pages）
      - name: Upload artifact 📤
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vuepress/dist

      # 3) 触发 GitHub Pages 服务从 artifact 拉取并发布；输出的 page_url 会注入到 environment
      - name: Deploy to GitHub Pages 🚀
        id: deployment
        uses: actions/deploy-pages@v4